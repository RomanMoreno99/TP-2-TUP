<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meriendas Destacadas</title>
    <link rel="stylesheet" href="estilos.css">
</head>

<body class="destacados">
    <div class="contenedor">
        <h1> Meriendas Destacadas </h1>
        <p class="subtitulo">Las mejores opciones de nuestro menú</p>

        <div class="seccion">
            <h2>Nuestras Favoritas</h2>
            <div id="destacadosContainer" class="destacados-container"></div>
        </div>

        <div class="navegacion">
            <a href="index.html">← Volver a Inicio</a>
            <a href="listado.html"> Siguiente página →</a>
        </div>
    </div>

    <script>
        // Datos de meriendas destacadas con descripción
        const meriendaDestacadas = [
            {
                nombre: "Galletas rellenas y chips de chocolate",
                descripcion: "Galletas caseras rellenas de chocolate derretido. Perfectas para cualquier hora del día."
            },
            {
                nombre: "Sándwich de jamón, queso y tomate",
                descripcion: "Sándwich fresco con ingredientes de calidad. Una opción nutritiva y deliciosa."
            },
            {
                nombre: "Yogur natural con frutos secos",
                descripcion: "Yogur natural sin azúcares añadidos. Excelente para la salud digestiva."
            }
        ];   
        // Mostrar meriendas destacadas usando map
        function cargarDestacados() {
            const container = document.getElementById('destacadosContainer');
            container.innerHTML = ''; // Limpiar contenedor

            // Usar map para transformar los datos en elementos HTML
            const tarjetas = meriendaDestacadas.map((item, indice) => {
                const tarjeta = document.createElement('div');
                tarjeta.className = 'tarjeta';
                tarjeta.innerHTML = `
                    <h3>${item.nombre}</h3>
                    <p>${item.descripcion}</p>
                `;
                tarjeta.addEventListener('click', function() {
                    resaltarTarjeta(this);
                });
                return tarjeta;
            });

            // Agregar todas las tarjetas al contenedor
            tarjetas.forEach(tarjeta => container.appendChild(tarjeta));
        }
                // Evento de clic para resaltar tarjetas
        function resaltarTarjeta(elemento) {
            // Remover resalte de otros elementos
            document.querySelectorAll('.tarjeta').forEach(tarjeta => {
                tarjeta.style.backgroundColor = 'white';
            });
            // Resaltar el elemento clickeado
            elemento.style.backgroundColor = '#fffacd';
        }

        // Cargar al cargar la página
        window.addEventListener('load', cargarDestacados);
    </script>

</body>

</html>
